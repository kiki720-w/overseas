<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工厂知识库 · Overseas</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/knowledge.css?v=20261004-blankfix1"><script defer src="/knowledge.js?v=20261004-blankfix1"></script></head><body class="knowledge-page"><main class="knowledge-main"><nav><a href="/">客户开发</a> · <a href="/deals">成交推进</a> · <a href="/settings">模型设置</a></nav><h1>工厂知识库</h1><p>资料仅本机保存。预览不会入库，确认后默认未核实；不自动发送给模型。</p><p id="formats"></p><p id="status" role="status" aria-live="polite">页面已打开，正在读取本机资料…</p><p id="load-help"><a href="/knowledge?view=20261004-blankfix1">重新打开知识页</a> · <button id="retry-load" type="button" class="secondary">重新读取本机资料</button></p><noscript><p>浏览器未启用 JavaScript，无法读取资料列表。请在普通浏览器中允许本机页面脚本，再重新打开本页。</p></noscript><section class="panel"><h2>资料列表与本地检索</h2><label>核对状态<select id="review-filter"><option value="">全部状态</option><option value="unverified">需核实</option><option value="source_checked">已核对原文（企业自述）</option><option value="confirmed">用户确认（非独立证明）</option><option value="rejected">拒绝用于分析</option></select></label><label>关键词<input id="query" maxlength="200"></label><button id="search">检索片段</button><button id="refresh" class="secondary">刷新资料列表（含停用）</button><div id="results"></div><div id="documents"></div></section><details id="import-panel" class="panel"><summary>导入资料 / 保存新版本</summary><form id="import-form"><label>资料标题<input name="title" maxlength="200" required></label><label>所属主体 / 来源公司（可选）<input name="source_company" maxlength="200"></label><label>分类<select name="category"><option value="product">产品</option><option value="capability">能力边界</option><option value="certification">认证</option><option value="case">案例</option><option value="sales_rule">销售规则</option></select></label><label>有效期（可选）<input name="expires_on" type="date"></label><label>文件（与粘贴二选一）<input id="file" type="file" accept=".txt,.md,.pdf,.docx"></label><label>或粘贴文本<textarea name="text" rows="7" maxlength="120000"></textarea></label><p id="version-note">新建资料</p><div class="actions"><button type="submit">只在本机解析预览</button><button type="button" id="reset-new" class="secondary">改为新建</button></div></form><div id="preview" hidden><h3>核对提取结果</h3><pre id="preview-text"></pre><label><input type="checkbox" id="consent">我已检查原文、分类及有效期，确认保存到本机（默认未核实）</label><div class="actions"><button id="confirm" disabled>明确确认保存</button><button id="discard" class="secondary">取消预览</button></div></div></details><section id="detail-panel" class="panel" hidden><h2>资料内容与版本</h2><div id="detail"></div></section><dialog id="review-dialog"><form id="review-form"><h2>核对原文（企业自述）</h2><p>只核对列明字段，不能证明性能、适配、有效认证或专利权属。审核理由、页码和时间将追加保存。</p><label>已核对字段（每行一个）<textarea name="fields" rows="3" required></textarea></label><label>核对理由<textarea name="reason" maxlength="2000" required></textarea></label><label>来源文件名<input name="filename" maxlength="200" required></label><label>来源SHA256<input name="sha256" maxlength="64" required></label><label>PDF物理页（逗号分隔）<input name="pages" required></label><label>印刷页（可选，逗号分隔）<input name="printed"></label><div class="actions"><button type="submit">保存原文核对记录</button><button id="cancel-review" type="button" class="secondary">取消</button></div></form></dialog><footer>搜索 / 社媒 / 海关未接入 · OCR 未接入 · 不自动报价或发邮件</footer></main></body></html>
